<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101822">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Круг">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.svg">
  <title>Круг — личные сообщения</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1118;
      --surface: #121c26;
      --surface-soft: #192633;
      --surface-hover: #213343;
      --line: #263746;
      --text: #f2f6f9;
      --muted: #8fa0af;
      --blue: #3186e5;
      --blue-dark: #216bbd;
      --danger: #ed7272;
      --radius: 16px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body { min-height: 100vh; }
    button, input, textarea { font: inherit; }
    button { border: 0; cursor: pointer; }
    .hidden { display: none !important; }

    /* Экран авторизации */
    .auth-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; position: relative; overflow: hidden; }
    .auth-screen::before, .auth-screen::after { content: ""; position: absolute; width: 360px; height: 360px; border-radius: 50%; filter: blur(2px); opacity: .22; pointer-events: none; }
    .auth-screen::before { background: #186fc7; top: -180px; right: -120px; }
    .auth-screen::after { background: #7136b8; bottom: -220px; left: -120px; }
    .auth-layout { width: min(100%, 900px); display: grid; grid-template-columns: 1fr 380px; gap: 72px; align-items: center; position: relative; z-index: 1; }
    .brand-block { padding: 16px 0; }
    .brand-mark { width: 58px; height: 58px; display: grid; place-items: center; margin-bottom: 24px; border-radius: 18px; background: linear-gradient(135deg, #4ca5ff, #2467c5); box-shadow: 0 12px 30px #1e75d04d; font-size: 28px; font-weight: 800; }
    .brand-block h1 { max-width: 430px; margin: 0 0 16px; font-size: clamp(34px, 5vw, 54px); line-height: 1.02; letter-spacing: -1.8px; }
    .brand-block p { max-width: 430px; margin: 0; color: var(--muted); font-size: 17px; line-height: 1.6; }
    .auth-card { background: #121c26e8; border: 1px solid var(--line); border-radius: 22px; padding: 28px; box-shadow: 0 24px 70px #0008; backdrop-filter: blur(14px); }
    .auth-card h2 { margin: 0 0 7px; font-size: 24px; }
    .auth-card .subtitle { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
    .auth-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 22px; padding: 4px; border-radius: 11px; background: var(--surface-soft); }
    .auth-tab { border-radius: 8px; padding: 10px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; }
    .auth-tab.active { background: #2a4052; color: var(--text); }
    .field { display: block; margin-bottom: 14px; }
    .field span { display: block; margin: 0 0 7px; color: #b7c4cf; font-size: 13px; font-weight: 600; }
    .field input { width: 100%; border: 1px solid var(--line); border-radius: 11px; outline: none; padding: 13px 14px; background: var(--surface-soft); color: var(--text); transition: border-color .2s, box-shadow .2s; }
    .field input:focus { border-color: #4c9bea; box-shadow: 0 0 0 3px #3186e526; }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 72px; }
    .password-toggle { position: absolute; top: 50%; right: 8px; width: auto; transform: translateY(-50%); padding: 6px 7px; border-radius: 6px; background: transparent; color: #8fa0af; font-size: 12px; }
    .password-toggle:hover { background: #ffffff0d; color: var(--text); }
    .primary-button { width: 100%; border-radius: 11px; padding: 13px 16px; background: var(--blue); color: white; font-weight: 700; transition: background .2s, transform .2s; }
    .primary-button:hover { background: #4396ed; }
    .primary-button:active { transform: translateY(1px); }
    .secondary-button { width: 100%; margin-top: 10px; border-radius: 11px; padding: 12px 16px; background: transparent; color: #a8cbed; font-weight: 600; }
    .secondary-button:hover { background: var(--surface-soft); }
    .primary-button:disabled { cursor: wait; opacity: .65; }
    .auth-error { min-height: 21px; margin: 3px 0 8px; color: var(--danger); font-size: 13px; line-height: 1.4; }
    .auth-switch { margin: 18px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
    .auth-switch button { padding: 0; background: transparent; color: #83bdf0; font-weight: 700; }

    /* Чат */
    .chat-screen { min-height: 100vh; display: none; justify-content: center; background: radial-gradient(circle at 50% -20%, #18334a 0, var(--bg) 42%); }
    .app-shell { width: min(100%, 1180px); height: 100vh; display: flex; overflow: hidden; border-inline: 1px solid #1c2a37; background: #0d151eec; box-shadow: 0 0 60px #0004; }
    .sidebar { width: 280px; flex: 0 0 280px; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: #101a24; }
    .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 18px; border-bottom: 1px solid var(--line); font-weight: 800; }
    .sidebar-brand-mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px; background: linear-gradient(135deg, #4ca5ff, #2467c5); }
    .chat-search { display: block; width: calc(100% - 24px); margin: 14px 12px 10px; border: 1px solid #ffffff12; border-radius: 10px; padding: 10px 12px; background: #0a121c; color: var(--text); outline: none; font-size: 13px; }
    .chat-search:focus { border-color: #4f9cf566; }
    .chat-list { padding: 0 10px 14px; border-bottom: 1px solid #ffffff12; }
    .chat-item { width: 100%; display: flex; align-items: center; gap: 10px; border-radius: 11px; padding: 10px; background: #1d3042; color: var(--text); text-align: left; }
    .chat-item .avatar { width: 38px; height: 38px; font-size: 13px; }
    .chat-item-copy { min-width: 0; flex: 1; }
    .chat-item-title { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; }
    .chat-item-time { color: var(--muted); font-size: 10px; font-weight: 400; }
    .chat-item-preview { overflow: hidden; margin-top: 4px; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .unread-badge { min-width: 20px; border-radius: 999px; padding: 2px 6px; background: var(--blue); color: white; font-size: 10px; text-align: center; }
    .nav { display: flex; min-height: 0; flex: 1; flex-direction: column; padding: 12px 10px; overflow-y: auto; }
    .nav-section-title { margin: 16px 12px 7px; color: #687b8b; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .nav-spacer { flex: 1; min-height: 34px; }
    .account-actions { display: flex; gap: 6px; margin-left: auto; }
    .account-action { width: 32px; height: 32px; border-radius: 8px; background: #ffffff08; color: var(--muted); }
    .account-action:hover { background: var(--surface-hover); color: white; }
    .account-identity { min-width: 0; flex: 1; display: flex; align-items: center; gap: 10px; padding: 0; background: transparent; color: var(--text); text-align: left; }
    .account-logout-button { border-radius: 8px; padding: 8px 9px; background: #ffffff08; color: var(--muted); font-size: 12px; font-weight: 600; }
    .account-logout-button:hover { background: #482b35; color: #ffb1b1; }
    .nav-button { width: 100%; display: flex; align-items: center; gap: 11px; margin-bottom: 4px; border-radius: 10px; padding: 11px 12px; background: transparent; color: #a9b9c6; text-align: left; font-size: 14px; font-weight: 600; }
    .nav-button:hover, .nav-button.active { background: #1d3040; color: white; }
    .nav-icon { width: 20px; color: #75b9f3; text-align: center; font-size: 16px; }
    .sidebar-account { display: flex; align-items: center; gap: 10px; min-height: 78px; padding: 13px 14px; border-top: 1px solid var(--line); background: #0c151f; }
    .sidebar-account .avatar { width: 34px; height: 34px; }
    .account-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 700; }
    .account-caption { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .chat { min-width: 0; flex: 1; height: 100vh; display: flex; flex-direction: column; background: #0d151e; }
    .chat-header { display: flex; align-items: center; gap: 12px; min-height: 74px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: #121c26e8; }
    .menu-button { display: none; width: 36px; height: 36px; border-radius: 9px; background: var(--surface-soft); color: white; font-size: 20px; }
    .chat-logo, .avatar { flex: 0 0 auto; display: grid; place-items: center; border-radius: 50%; background: linear-gradient(135deg, #398eea, #7257c7); color: white; font-weight: 800; }
    .chat-logo { width: 42px; height: 42px; font-size: 20px; }
    .chat-title { min-width: 0; }
    .chat-title strong { display: block; font-size: 16px; }
    .chat-title small { display: flex; align-items: center; gap: 5px; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .chat-subtitle { color: var(--muted); font-size: 11px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #e6a65d; }
    .status-dot.online { background: #62c783; }
    .current-user { margin-left: auto; color: var(--muted); font-size: 13px; }
    .logout-button { border-radius: 9px; padding: 9px 12px; background: var(--surface-soft); color: #b9c6d1; font-size: 13px; font-weight: 600; }
    .logout-button:hover { background: var(--surface-hover); color: white; }
    .messages { position: relative; display: flex; flex-direction: column; flex: 1; overflow-y: auto; padding: 18px clamp(10px, 4vw, 42px); scroll-behavior: smooth; }
    .messages.has-messages::before { content: ""; flex: 1 0 0; min-height: 80px; }
    .messages::-webkit-scrollbar { width: 8px; }
    .messages::-webkit-scrollbar-thumb { border-radius: 8px; background: #314453; }
    .welcome { display: grid; place-items: center; min-height: 100%; color: var(--muted); text-align: center; }
    .welcome-icon { width: 52px; height: 52px; display: grid; place-items: center; margin: 0 auto 13px; border-radius: 16px; background: var(--surface-soft); color: #72b7f7; font-size: 24px; }
    .welcome strong { display: block; margin-bottom: 5px; color: var(--text); }
    .welcome p { margin: 0; font-size: 13px; }
    .date-divider { display: flex; align-items: center; gap: 10px; margin: 13px 0; color: #aab9c5; font-size: 11px; justify-content: center; }
    .date-divider::before, .date-divider::after { content: ""; width: 32px; height: 1px; background: #ffffff12; }
    .message-row { display: flex; gap: 8px; align-items: flex-end; margin: 2px 0; }
    .message-row.group-start { margin-top: 10px; }
    .message-row.mine { flex-direction: row-reverse; }
    .avatar-spacer, .avatar { width: 30px; height: 30px; flex: 0 0 30px; font-size: 11px; }
    .avatar { font-size: 16px; }
    .avatar-spacer { visibility: hidden; }
    .message { position: relative; max-width: min(76%, 640px); border: 1px solid #2b3c4b; border-radius: 16px 16px 16px 5px; padding: 10px 13px 8px; background: var(--surface-soft); box-shadow: 0 3px 12px #00000020; }
    .mine .message { border-color: #2778c7; border-radius: 15px 15px 5px 15px; background: #1d5d98; }
    .group-start:not(.mine) .message::before { content: ""; position: absolute; left: -6px; bottom: -1px; width: 12px; height: 12px; background: var(--surface-soft); clip-path: polygon(100% 0, 100% 100%, 0 100%); }
    .group-start.mine .message::before { content: ""; position: absolute; right: -6px; bottom: -1px; width: 12px; height: 12px; background: #1d5d98; clip-path: polygon(0 0, 100% 100%, 0 100%); }
    .sender { margin-bottom: 3px; color: #8fc5f5; font-size: 12px; font-weight: 700; }
    .message-text { display: inline; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; font-size: 14px; }
    .reply-preview { margin: 0 0 8px; border-left: 3px solid #72b7f7; border-radius: 4px; padding: 5px 8px; background: #ffffff0c; color: #b8d8f4; font-size: 11px; }
    .reply-preview strong { display: block; margin-bottom: 2px; color: #8fc5f5; }
    .message-time { display: inline-block; margin: 4px 0 0 9px; color: #a9c2d5; font-size: 10px; vertical-align: bottom; white-space: nowrap; }
    .message-check { margin-left: 3px; color: #9fcfff; font-size: 11px; }
    .voice-message { display: flex; align-items: center; min-width: 220px; gap: 10px; padding: 4px 0 2px; }
    .voice-message audio { display: none; }
    .voice-play { display: grid; width: 36px; height: 36px; flex: 0 0 36px; place-items: center; border-radius: 50%; background: #70b8f5; color: #102130; font-size: 12px; }
    .mine .voice-play { background: #d8f0ff; }
    .voice-play span { margin-left: 2px; }
    .voice-wave { display: flex; height: 32px; flex: 1; align-items: center; justify-content: space-between; gap: 2px; }
    .voice-wave i { width: 3px; min-height: 5px; border-radius: 5px; background: #86b7d6; opacity: .7; }
    .voice-message.playing .voice-wave i { animation: voice-wave .7s ease-in-out infinite alternate; }
    .voice-message.playing .voice-wave i:nth-child(3n) { animation-delay: .2s; }
    .voice-message.playing .voice-wave i:nth-child(4n) { animation-delay: .4s; }
    @keyframes voice-wave { to { transform: scaleY(1.35); opacity: 1; } }
    .voice-duration { color: #a9c2d5; font-size: 11px; white-space: nowrap; }
    .message-row.selected .message { outline: 2px solid #69b4ff; outline-offset: 2px; }
    .selection-toolbar { display: none; align-items: center; gap: 8px; min-height: 58px; padding: 7px 16px; border-bottom: 1px solid #ffffff12; background: #101b27f5; }
    .selection-toolbar.open { display: flex; }
    .selection-toolbar strong { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .selection-toolbar button { min-width: 44px; min-height: 44px; border-radius: 10px; background: #ffffff0d; color: var(--text); font-size: 20px; }
    .selection-toolbar .selection-delete { color: #ff9e9e; }
    .selection-toolbar .selection-delete.hidden { display: none; }
    .selection-toolbar button:hover { background: var(--surface-hover); }
    .avatar-picker { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; margin-top: 12px; }
    .avatar-choice { min-width: 38px; min-height: 38px; border: 1px solid transparent; border-radius: 11px; background: #ffffff08; font-size: 22px; }
    .avatar-choice.active { border-color: #69b4ff; background: #24527b; }
    .profile-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 0 0 22px; }
    .profile-stat { border-radius: 12px; padding: 12px; background: #ffffff08; }
    .profile-stat strong, .profile-stat span { display: block; }
    .profile-stat strong { font-size: 18px; }
    .profile-stat span { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .system { margin: 15px auto; color: #758897; font-size: 12px; text-align: center; }
    .chat-notice { position: absolute; z-index: 3; left: 50%; bottom: 86px; max-width: min(420px, calc(100% - 32px)); transform: translateX(-50%); border: 1px solid #ffffff1c; border-radius: 10px; padding: 10px 13px; background: #2f2029; color: #ffd0d0; box-shadow: 0 10px 30px #0006; font-size: 13px; text-align: center; }
    .typing-indicator { min-height: 20px; padding: 0 24px 5px; color: #83bdf0; font-size: 12px; }
    .typing-indicator::after { content: ' ···'; letter-spacing: 2px; }
    .reply-bar { display: none; align-items: center; gap: 10px; padding: 8px 20px; border-top: 1px solid #ffffff12; background: #0d1722; }
    .reply-bar.open { display: flex; }
    .reply-bar-copy { min-width: 0; flex: 1; border-left: 3px solid #72b7f7; padding-left: 8px; }
    .reply-bar-copy strong, .reply-bar-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reply-bar-copy strong { color: #8fc5f5; font-size: 12px; }
    .reply-bar-copy span { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .reply-cancel { min-width: 36px; min-height: 36px; border-radius: 8px; background: transparent; color: var(--muted); font-size: 22px; }
    body.compact .message-row { margin: 0; }
    body.compact .message { padding-block: 6px; }
    .composer { display: flex; min-width: 0; gap: 10px; padding: 14px 20px max(14px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: #121c26e8; }
    .composer input { min-width: 0; flex: 1; border: 1px solid var(--line); border-radius: 20px; outline: none; padding: 11px 16px; background: var(--surface-soft); color: var(--text); }
    .composer input:focus { border-color: #4c9bea; }
    .composer textarea { min-width: 0; flex: 1; min-height: 44px; max-height: 120px; resize: none; border: 1px solid #ffffff18; border-radius: 20px; outline: none; padding: 12px 16px; background: #0d1722; color: var(--text); line-height: 1.35; }
    .composer textarea:focus { border-color: #4c9bea; }
    .emoji-wrap { position: relative; }
    .emoji-button { width: 42px; height: 42px; border-radius: 50%; align-self: center; background: transparent; color: #f3c86b; font-size: 22px; }
    .emoji-button:hover { background: var(--surface-hover); }
    .emoji-picker { position: absolute; right: 0; bottom: 57px; z-index: 2; width: min(310px, calc(100vw - 24px)); padding: 12px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); box-shadow: 0 16px 40px #0009; }
    .emoji-heading { display: flex; justify-content: space-between; margin-bottom: 9px; color: var(--muted); font-size: 12px; }
    .emoji-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .emoji-item { width: 100%; border-radius: 8px; padding: 6px 2px; background: transparent; font-size: 22px; line-height: 1; }
    .emoji-item:hover { background: var(--surface-hover); }
    .send-button, .record-button { width: 44px; height: 44px; align-self: center; flex: 0 0 44px; border-radius: 15px; background: var(--blue); color: white; font-size: 18px; box-shadow: 0 7px 18px #2787d04d; }
    .record-button { position: relative; display: grid; place-items: center; background: #1d364a; color: #8fd2ff; box-shadow: none; }
    .record-button::before { content: ''; width: 14px; height: 19px; border: 2px solid currentColor; border-radius: 9px; }
    .record-button::after { content: ''; position: absolute; width: 22px; height: 11px; border: 2px solid currentColor; border-top: 0; border-radius: 0 0 14px 14px; transform: translateY(5px); }
    .record-button.recording { background: #d95858; color: white; animation: recording-pulse 1.1s infinite; }
    .record-button.recording::before { width: 14px; height: 14px; border: 0; border-radius: 4px; background: currentColor; }
    .record-button.recording::after { display: none; }
    @keyframes recording-pulse { 50% { box-shadow: 0 0 0 8px #d9585833; } }
    .recording-status { display: none; align-self: center; min-width: 0; flex: 1; color: #ffaaaa; font-size: 12px; text-align: right; }
    .recording-status.visible { display: block; color: #ffb1b1; }
    .call-button { display: grid; min-width: 44px; min-height: 44px; place-items: center; border: 1px solid #2b4960; border-radius: 13px; color: #b8ddf8; background: #172d3e; }
    .call-button svg, .header-icon-button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.9; }
    .call-button.active { background: #d95858; }
    .call-screen { position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column; overflow: hidden; background: radial-gradient(circle at 50% 15%, #28618f 0, #0b131d 50%); }
    .call-screen.hidden { display: none; }
    .call-screen::before, .call-screen::after { content: ''; position: absolute; width: 300px; height: 300px; border: 1px solid #a8d9ff22; border-radius: 50%; left: 50%; top: 42%; transform: translate(-50%, -50%); pointer-events: none; }
    .call-screen::after { width: 410px; height: 410px; border-color: #a8d9ff12; }
    .call-screen-head { display: flex; align-items: center; justify-content: space-between; padding: max(18px, env(safe-area-inset-top)) 20px 18px; }
    .call-screen-head strong { font-size: 16px; }
    .call-screen-close { width: 44px; height: 44px; border-radius: 50%; background: #ffffff12; color: white; font-size: 24px; }
    .call-profile { position: relative; z-index: 1; display: grid; justify-items: center; gap: 14px; margin: auto; }
    .call-avatar { display: grid; place-items: center; width: 118px; height: 118px; border: 7px solid #ffffff1f; border-radius: 50%; background: linear-gradient(145deg, #63b5ff, #7357d8); font-size: 48px; box-shadow: 0 18px 50px #0006; }
    .call-screen.ringing .call-avatar { animation: call-pulse 1.4s ease-in-out infinite; }
    @keyframes call-pulse { 50% { transform: scale(1.06); box-shadow: 0 0 0 18px #8dcfff1c, 0 18px 50px #0006; } }
    .call-name { font-size: 28px; font-weight: 800; }
    .call-status { color: #a8bfd2; font-size: 15px; }
    .call-actions { position: relative; z-index: 1; display: flex; justify-content: center; gap: 18px; padding: 22px 20px max(28px, env(safe-area-inset-bottom)); }
    .call-action { display: grid; place-items: center; width: 60px; height: 60px; border-radius: 20px; background: #ffffff16; color: white; font-size: 0; }
    .call-action::before { font-size: 24px; }
    #call-mute::before { content: '♩'; }
    #call-speaker::before { content: '⌁'; font-size: 30px; transform: rotate(90deg); }
    #call-speaker.active::before { content: '⌁'; }
    #call-accept::before { content: '☎'; transform: rotate(-25deg); }
    #call-end::before { content: '☎'; transform: rotate(135deg); }
    .call-action.active { background: #438fe0; }
    .call-action.end { background: #d95858; }
    .page-screen { position: absolute; inset: 0; z-index: 6; display: none; flex-direction: column; background: var(--surface); }
    .page-screen.open { display: flex; }
